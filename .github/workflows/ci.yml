name: CI

on:
  pull_request:
    branches: [master]

# Cancel in-flight runs for the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Note: Runs on PRs only. Push to master runs semantic-release only (see semantic-release.yml).
# This keeps master clean — lint/test/smoke must pass on the PR before merge.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Lint and type-check (fast feedback, no test deps needed)
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Mypy
        run: uv run mypy src/

  # ───────────────────────────────────────────────────────────────────────────
  # Tests — matrix across supported Python versions
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Unit tests
        run: uv run pytest tests/unit/ -v --tb=short --no-cov

      - name: Integration tests (excluding MCP)
        run: uv run pytest tests/integration/ --ignore=tests/integration/test_mcp_command.py -v --tb=short --no-cov

      - name: Coverage (combined unit + integration)
        run: uv run pytest tests/unit/ tests/integration/ --ignore=tests/integration/test_mcp_command.py -q

  # ───────────────────────────────────────────────────────────────────────────
  # MCP extra — separate job so it doesn't slow down the main matrix
  # ───────────────────────────────────────────────────────────────────────────
  test-mcp:
    name: Test MCP extra
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install with MCP extra
        run: uv sync --group dev --extra mcp

      - name: MCP integration tests
        run: uv run pytest tests/integration/test_mcp_command.py -v --tb=short --no-cov

  # ───────────────────────────────────────────────────────────────────────────
  # Package — prove the wheel/sdist builds and ships every non-Python asset.
  # This is the only check the release pipeline used to do exclusively, which
  # meant a broken package was discovered after merge. Run it on the PR.
  # ───────────────────────────────────────────────────────────────────────────
  package:
    name: Package build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Build wheel and sdist
        run: uv build

      - name: Verify wheel contents
        run: |
          uv run python - <<'PY'
          import glob
          import sys
          import zipfile

          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()

          missing = [
              part
              for part in ("cerebrofy/__init__.py", "cerebrofy/cli.py")
              if part not in names
          ]
          if not any("upgrade/manifests/" in name for name in names):
              missing.append("cerebrofy/upgrade/manifests/*.yaml")
          if not any(name.endswith("METADATA") for name in names):
              missing.append("*.dist-info/METADATA")

          if missing:
              print(f"wheel {whl} is missing: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"{whl}: {len(names)} files, all required assets present")
          PY

      - name: Install the wheel and smoke the entry point
        run: |
          uv pip install --force-reinstall --no-deps dist/*.whl
          # --no-sync keeps the wheel install; a plain `uv run` would reinstall
          # the editable project and hide a broken wheel.
          uv run --no-sync cerebrofy --version
          uv run --no-sync cerebrofy --help > /dev/null

  # ───────────────────────────────────────────────────────────────────────────
  # CLI gates — run key commands end-to-end on a fresh repo
  # ───────────────────────────────────────────────────────────────────────────
  cli-gates:
    name: CLI gates (validate/health/coverage-gap/vuln/arch)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Configure git identity
        run: |
          git config --global user.email "ci@cerebrofy.test"
          git config --global user.name "Cerebrofy CI"

      - name: Init + build index
        run: |
          uv run cerebrofy init --no-mcp
          uv run python - <<'PY'
          from unittest.mock import patch

          from click.testing import CliRunner

          from cerebrofy.cli import main
          from cerebrofy.embedder.base import Embedder


          class _FakeEmbedder(Embedder):
              @property
              def dim(self) -> int:
                  return 768

              def embed(self, texts):
                  return [[0.0] * 768 for _ in texts]


          runner = CliRunner()
          with patch("cerebrofy.commands.build.get_embedder", return_value=_FakeEmbedder()):
              result = runner.invoke(main, ["build"])
              assert result.exit_code == 0, result.output
          PY
          echo "Init + build complete"

      - name: Validate command
        run: uv run cerebrofy validate
        id: validate

      - name: Health command
        run: uv run cerebrofy health
        id: health

      - name: Coverage-gap command
        run: uv run cerebrofy coverage-gap
        id: coverage-gap

      - name: Vuln command
        run: uv run cerebrofy vuln --package requests
        id: vuln

      - name: Arch check command
        run: uv run cerebrofy arch check
        id: arch-check