name: Release

# Triggers on semantic version tags pushed to master: v1.2.3
#
# Nothing here re-runs lint or the test suite. Those are PR gates (ci.yml,
# smoke.yml) and must be green before the merge that produced this tag.
# The only new commit the tests never saw is semantic-release's own version
# bump, which is mechanical — so this pipeline builds the artifact and
# verifies the artifact itself, which is the one thing the PR cannot prove
# about the tagged tree.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Cancel any in-flight release run for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build: wheel + sdist from the tagged commit, then verify the artifact
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Build wheel and sdist
        run: uv build

      - name: Verify wheel contents
        run: |
          uv run python - <<'PY'
          import glob
          import sys
          import zipfile

          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()

          missing = [
              part
              for part in ("cerebrofy/__init__.py", "cerebrofy/cli.py")
              if part not in names
          ]
          if not any("upgrade/manifests/" in name for name in names):
              missing.append("cerebrofy/upgrade/manifests/*.yaml")
          if not any(name.endswith("METADATA") for name in names):
              missing.append("*.dist-info/METADATA")

          if missing:
              print(f"wheel {whl} is missing: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"{whl}: {len(names)} files, all required assets present")
          PY

      - name: Install the wheel and smoke the entry point
        run: |
          uv pip install --force-reinstall --no-deps dist/*.whl
          # --no-sync keeps the wheel install; a plain `uv run` would reinstall
          # the editable project and hide a broken wheel.
          uv run --no-sync cerebrofy --version
          uv run --no-sync cerebrofy --help > /dev/null

      - name: Verify the tag matches the packaged version
        run: |
          uv run python - <<'PY'
          import os
          import sys

          from cerebrofy import __version__

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              sys.exit(f"tag {tag} != packaged version {__version__}")
          print(f"tag and packaged version agree: {tag}")
          PY

      - name: Verify dist/ contents
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Publish: GitHub Release + PyPI
  #
  # PyPI uses OIDC Trusted Publisher — no static token needed.
  # One-time setup at pypi.org → your project → Publishing → Add a publisher:
  #   Owner: mm0rsy  |  Repo: Cerebrofy  |  Workflow: release.yml  |  Job: publish
  #   Environment name: pypi
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI & GitHub
    needs: build
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: write   # create GitHub Release and upload release assets
      id-token: write   # PyPI OIDC Trusted Publisher

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
